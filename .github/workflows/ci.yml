name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, clippy and tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install FEN verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish
          echo "KNIGHTBYTE_FEN_VERIFIER=$(command -v stockfish)" >> "$GITHUB_ENV"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets

  macos:
    name: Build and test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
      - name: Install FEN verifier
        run: |
          brew install stockfish
          echo "KNIGHTBYTE_FEN_VERIFIER=$(command -v stockfish)" >> "$GITHUB_ENV"
      - name: Tests
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release

  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
      - name: Install FEN verifier
        shell: pwsh
        run: |
          choco install stockfish -y --no-progress
          $verifier = (Get-ChildItem "C:\Program Files\ChessEngines" -Recurse -Filter "stockfish*.exe" | Select-Object -First 1).FullName
          if (-not $verifier) { throw "FEN verifier not found after package install" }
          "KNIGHTBYTE_FEN_VERIFIER=$verifier" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Tests
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
